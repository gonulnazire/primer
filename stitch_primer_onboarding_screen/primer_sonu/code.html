<!DOCTYPE html>

<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-bright": "#36393f", "on-tertiary-container": "#00486a", "surface-container-lowest": "#0b0e13", "on-error-container": "#ffdad6", "surface": "#111319", "on-surface-variant": "#d6c4b0", "secondary-fixed": "#d7e3f7", "outline-variant": "#514536", "error": "#ffb4ab", "on-error": "#690005", "on-tertiary-fixed": "#001e2f", "inverse-primary": "#835400", "on-background": "#e1e2e9", "surface-container-low": "#191c21", "on-secondary": "#263140", "secondary-fixed-dim": "#bbc7da", "secondary": "#bbc7da", "surface-container": "#1d2025", "tertiary-fixed-dim": "#8bceff", "outline": "#9e8e7c", "on-primary-fixed-variant": "#643f00", "surface-dim": "#111319", "inverse-surface": "#e1e2e9", "primary-fixed": "#ffddb5", "error-container": "#93000a", "tertiary": "#99d3ff", "background": "#111319", "surface-variant": "#32353a", "on-secondary-fixed-variant": "#3c4857", "surface-tint": "#ffb956", "on-primary": "#462b00", "tertiary-fixed": "#c9e6ff", "on-tertiary": "#00344e", "secondary-container": "#3e4a59", "primary-container": "#e8a33d", "on-tertiary-fixed-variant": "#004b6f", "primary-fixed-dim": "#ffb956", "tertiary-container": "#63b9f3", "inverse-on-surface": "#2e3036", "primary": "#ffc16c", "on-secondary-container": "#adb9cc", "on-primary-container": "#5f3c00", "surface-container-high": "#272a30", "on-primary-fixed": "#2a1800", "on-secondary-fixed": "#101c2a", "surface-container-highest": "#32353a", "on-surface": "#e1e2e9" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xl": "1.5rem", "space-xs": "0.5rem", "space-2xl": "2rem", "space-3xl": "2.5rem", "space-lg": "1.25rem", "space-2xs": "0.25rem", "space-md": "1rem", "gutter": "1rem", "space-sm": "0.75rem", "margin": "1.25rem" }, "fontFamily": { "headline-md": ["Inter"], "headline-sm": ["Inter"], "body-sm": ["Inter"], "display-lg": ["Inter"], "body-lg": ["Inter"], "body-md": ["Inter"], "headline-lg": ["Inter"], "label-caps": ["Inter"], "label-lg": ["Inter"], "label-md": ["Inter"] }, "fontSize": { "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" }], "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "label-caps": ["11px", { "lineHeight": "14px", "letterSpacing": "0.06em", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }] } } } }</script><style>@layer base { html, body { width: 100%; margin: 0; padding: 0; } body { overscroll-behavior-y: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full bg-surface pt-safe pb-safe"><div class="flex flex-col w-full px-margin pb-safe space-y-space-xl">
<!-- Top Navigation & Session Header Rhythm -->
<header class="flex items-center justify-between pt-space-md">
<div class="flex items-center space-x-space-xs">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Simülasyon Özeti</span>
</div>
<div class="flex items-center space-x-space-2xs bg-surface-container-high px-space-xs py-1 rounded-full">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">terminal</span>
<span class="font-label-caps text-label-caps text-on-surface">REV // 084</span>
</div>
</header>
<!-- Outcome Banner -->
<section class="relative overflow-hidden rounded-xl bg-surface-container-lowest shadow-sm">
<div class="absolute inset-0 bg-[#4FB286]/10 pointer-events-none"></div>
<div class="relative flex items-center justify-between p-space-lg">
<div class="flex items-center space-x-space-md">
<!-- Visual Accent Indicator (Border Alternative) -->
<div class="w-1.5 h-10 rounded-full bg-[#4FB286] shrink-0"></div>
<div class="flex flex-col">
<div class="flex items-center space-x-space-xs">
<span class="font-headline-md text-headline-md text-on-surface font-semibold tracking-tight">İYİ SON</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">2/3 sağlam karar</span>
</div>
</div>
<div class="w-10 h-10 rounded-full bg-[#4FB286]/20 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[#4FB286] text-[22px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</section>
<!-- Outcome Description Narrative -->
<section class="px-space-2xs">
<p class="font-body-lg text-body-lg text-on-surface leading-relaxed font-normal">
      Proje teslim edildi. Hoca eksikleri biliyordu, demo canlıda çalıştı.
    </p>
</section>
<!-- Reflective Quote Block (Quiet & Analytical Tone) -->
<section class="bg-surface-container rounded-xl p-space-xl relative shadow-md">
<div class="flex flex-col space-y-space-sm">
<!-- Amber Stylized Quotation Mark -->
<div class="w-8 h-8 flex items-center justify-start text-primary">
<svg class="w-7 h-7 fill-current" viewbox="0 0 24 24">
<path d="M9.983 3v7.391c0 5.704-3.731 9.57-8.983 10.609l-.995-2.151c2.432-.917 3.995-3.638 3.995-5.849h-4v-10h9.983zm14.017 0v7.391c0 5.704-3.748 9.571-9 10.609l-.996-2.151c2.433-.917 3.996-3.638 3.996-5.849h-3.983v-10h9.983z"></path>
</svg>
</div>
<!-- Verbatim Analytical Reflection -->
<blockquote class="font-body-md text-body-md text-on-surface leading-relaxed pt-space-2xs font-normal">
        Son çalışan commit'e dönmeyi seçtin. O commit'in gerçekten çalıştığını nereden biliyordun? Kaybolan iş kimin işiydi?
      </blockquote>
<!-- Subtle Meta Timestamp -->
<div class="pt-space-xs flex items-center space-x-1.5 opacity-60">
<span class="material-symbols-outlined text-[14px] text-on-surface-variant">history_edu</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Post-Mortem Çıkarımı</span>
</div>
</div>
</section>
<!-- Interactive Action Decisions -->
<footer class="flex flex-col items-center space-y-space-md pt-space-lg w-full">
<!-- Primary Flow Action -->
<button class="w-full min-h-[50px] bg-primary text-on-primary font-label-lg text-label-lg rounded-xl flex items-center justify-center space-x-space-xs active:scale-[0.98] transition-transform select-none shadow-sm" id="btn-next-crisis" type="button">
<span>Başka bir kriz dene</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Secondary Replay Action -->
<button class="min-h-[48px] px-space-md text-primary font-label-lg text-label-lg flex items-center justify-center space-x-1.5 active:opacity-75 transition-opacity select-none" id="btn-replay-crisis" type="button">
<span class="material-symbols-outlined text-[18px]">replay</span>
<span>Aynı krizi tekrar oyna</span>
</button>
</footer>
</div>
<script>
  (function() {
    const nextBtn = document.getElementById('btn-next-crisis');
    const replayBtn = document.getElementById('btn-replay-crisis');

    if (nextBtn) {
      nextBtn.addEventListener('click', () => {
        // Interactive haptic-like tap feedback
        nextBtn.classList.add('opacity-90');
        setTimeout(() => nextBtn.classList.remove('opacity-90'), 150);
      });
    }

    if (replayBtn) {
      replayBtn.addEventListener('click', () => {
        replayBtn.classList.add('opacity-60');
        setTimeout(() => replayBtn.classList.remove('opacity-60'), 150);
      });
    }
  })();
</script></main></body></html>
