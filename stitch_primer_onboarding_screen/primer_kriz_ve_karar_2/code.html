<!DOCTYPE html>

<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100vh;}body{overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-tertiary-container": "#00486a", "on-tertiary-fixed-variant": "#004b6f", "background": "#111319", "on-secondary": "#263140", "on-background": "#e1e2e9", "surface-tint": "#ffb956", "on-secondary-fixed-variant": "#3c4857", "error-container": "#93000a", "inverse-on-surface": "#2e3036", "on-primary-fixed": "#2a1800", "surface-variant": "#32353a", "primary-fixed-dim": "#ffb956", "surface-container-high": "#272a30", "on-primary-fixed-variant": "#643f00", "primary": "#ffc16c", "inverse-primary": "#835400", "surface": "#111319", "surface-dim": "#111319", "on-error-container": "#ffdad6", "secondary-fixed": "#d7e3f7", "surface-container-lowest": "#0b0e13", "surface-bright": "#36393f", "primary-fixed": "#ffddb5", "on-secondary-container": "#adb9cc", "tertiary-fixed": "#c9e6ff", "on-error": "#690005", "on-surface-variant": "#d6c4b0", "on-primary-container": "#5f3c00", "outline-variant": "#514536", "tertiary-fixed-dim": "#8bceff", "secondary-fixed-dim": "#bbc7da", "primary-container": "#e8a33d", "on-tertiary-fixed": "#001e2f", "tertiary": "#99d3ff", "on-tertiary": "#00344e", "error": "#ffb4ab", "on-secondary-fixed": "#101c2a", "secondary-container": "#3e4a59", "secondary": "#bbc7da", "surface-container": "#1d2025", "on-surface": "#e1e2e9", "on-primary": "#462b00", "surface-container-highest": "#32353a", "outline": "#9e8e7c", "surface-container-low": "#191c21", "inverse-surface": "#e1e2e9", "tertiary-container": "#63b9f3" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-2xl": "2rem", "space-md": "1rem", "space-sm": "0.75rem", "gutter": "1rem", "space-3xl": "2.5rem", "space-xs": "0.5rem", "margin": "1.25rem", "space-2xs": "0.25rem", "space-lg": "1.25rem", "space-xl": "1.5rem" }, fontFamily: { "headline-md": ["Inter"], "headline-sm": ["Inter"], "display-lg": ["Inter"], "body-sm": ["Inter"], "label-md": ["Inter"], "body-lg": ["Inter"], "body-md": ["Inter"], "headline-lg": ["Inter"], "label-lg": ["Inter"], "label-caps": ["Inter"] }, fontSize: { "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "label-caps": ["11px", { "lineHeight": "14px", "letterSpacing": "0.06em", "fontWeight": "600" }] } } } }</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col pt-safe pb-safe selection:bg-primary-container selection:text-on-primary-container"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full max-w-[390px] mx-auto px-5 pb-8 select-none">
<!-- Top Navigation & Progress Dots -->
<header class="flex items-center justify-between pt-3 pb-6">
<button aria-label="Menüye geri dön" class="group flex items-center gap-1.5 py-2 text-secondary hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="font-body-md text-body-md tracking-normal text-secondary group-hover:text-on-surface">← Menü</span>
</button>
<div aria-label="Kriz adımı 2 / 3" aria-valuemax="3" aria-valuemin="1" aria-valuenow="2" class="flex items-center gap-1.5" role="progressbar"><span class="w-2 h-2 rounded-full bg-[#E8A33D]"></span>
<span class="w-2 h-2 rounded-full bg-[#E8A33D]"></span>
<span class="w-2 h-2 rounded-full border border-[#222A35] bg-transparent"></span></div>
</header>
<!-- Incident Status Micro-Tag -->
<!-- Crisis Panel -->
<section class="relative bg-[#161B22] rounded-[16px] border border-[#222A35] overflow-hidden shadow-lg mb-7 flex">
<div class="w-[3px] bg-[#E8A33D] shrink-0 self-stretch"></div>
<div class="p-4 flex-1">
<p class="font-body-lg text-[16px] leading-relaxed text-[#E6EAF0]">Teslime 48 saat kaldı. Son migration veritabanını kilitledi, kimse projeyi local'de açamıyor. Hoca canlı demo bekliyor.</p>
</div>
</section>
<!-- Prompt Question Heading -->
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-4">
    Ne yapıyorsun?
  </h1>
<!-- Equal Stacked Decision Buttons -->
<div aria-label="Karar seçenekleri" class="flex flex-col gap-3 mb-6" role="radiogroup"><button class="decision-option text-left w-full bg-[#161B22] border border-[#222A35] active:bg-[#222A35] rounded-xl p-4 min-h-[48px] flex items-center transition-all duration-150" onclick="selectDecision(this)" type="button">
<span class="font-medium text-[15px] leading-snug text-[#E6EAF0]">Son çalışan commit'e dön, kaybolan işi sonra ekle</span>
</button>
<button class="decision-option text-left w-full bg-[#161B22] border border-[#222A35] active:bg-[#222A35] rounded-xl p-4 min-h-[48px] flex items-center transition-all duration-150" onclick="selectDecision(this)" type="button">
<span class="font-medium text-[15px] leading-snug text-[#E6EAF0]">Gece boyu hatayı debug et, çözene kadar uğraş</span>
</button>
<button class="decision-option text-left w-full bg-[#161B22] border border-[#222A35] active:bg-[#222A35] rounded-xl p-4 min-h-[48px] flex items-center transition-all duration-150" onclick="selectDecision(this)" type="button">
<span class="font-medium text-[15px] leading-snug text-[#E6EAF0]">Kendi branch'inde minimal çalışan bir sürüm kur</span>
</button></div>
<!-- Bottom Advisory Micro-copy -->
<footer class="mt-auto pt-2 flex items-center justify-center gap-1.5"><p class="text-[12px] text-[#9AA6B8] text-center">Seçtikten sonra geri dönemezsin.</p></footer>
</div>
<script>
  function selectDecision(buttonElement) {
    const allButtons = document.querySelectorAll('.decision-option');
    allButtons.forEach(btn => {
      btn.disabled = true;
      btn.classList.add('opacity-40', 'pointer-events-none');
    });
    buttonElement.classList.remove('opacity-40');
    buttonElement.classList.add('scale-[0.98]', 'bg-surface-container-high');
  }
</script></main></body></html>
