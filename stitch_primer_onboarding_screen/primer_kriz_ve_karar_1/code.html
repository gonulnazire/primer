    body {

  </head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col pt-safe pb-safe selection:bg-primary-container selection:text-on-primary-container"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full max-w-[390px] mx-auto px-5 pb-8 select-none">
<!-- Top Navigation & Progress Dots -->
<header class="flex items-center justify-between pt-3 pb-6">
<button aria-label="Menüye geri dön" class="group flex items-center gap-1.5 py-2 text-secondary hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="font-body-md text-body-md tracking-normal text-secondary group-hover:text-on-surface">← Menü</span>
</button>
<div aria-label="Kriz adımı 2 / 3" aria-valuemax="3" aria-valuemin="1" aria-valuenow="2" class="flex items-center gap-1.5" role="progressbar">
<span class="w-2 h-2 rounded-full bg-primary-container"></span>
<span class="w-2 h-2 rounded-full bg-primary-container"></span>
<span class="w-2 h-2 rounded-full bg-surface-container-highest"></span>
</div>
</header>
<!-- Incident Status Micro-Tag -->
<div class="flex items-center gap-2 mb-3">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container animate-pulse"></span>
<span class="font-label-caps text-label-caps tracking-widest text-primary uppercase">SENARYO • KRİZ #02</span>
</div>
<!-- Crisis Panel -->
<section class="relative bg-surface-container-low rounded-xl overflow-hidden shadow-lg mb-7">
<div class="flex">
<!-- Amber Left Edge Stripe -->
<div class="w-[3px] bg-primary-container shrink-0"></div>
<div class="p-4 flex-1">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-[18px]">warning</span>
<span class="font-label-md text-label-md text-primary font-medium tracking-wide">Acil Durum Bildirimi</span>
</div>
<p class="font-body-lg text-body-lg text-on-surface leading-relaxed">
          Teslime 48 saat kaldı. Son migration veritabanını kilitledi, kimse projeyi local'de açamıyor. Hoca canlı demo bekliyor.
        </p>
</div>
</div>
</section>
<!-- Prompt Question Heading -->
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-4">
    Ne yapıyorsun?
  </h1>
<!-- Equal Stacked Decision Buttons -->
<div aria-label="Karar seçenekleri" class="flex flex-col gap-3 mb-6" role="radiogroup">
<!-- Option 1 -->
<button class="decision-option text-left w-full bg-surface-container-low active:bg-surface-container-high rounded-xl p-4 min-h-[52px] flex items-center justify-between transition-all duration-150 group" onclick="selectDecision(this)" type="button">
<span class="font-body-md text-body-md text-on-surface group-active:text-primary transition-colors leading-snug pr-2">
        Son çalışan commit'e dön, kaybolan işi sonra ekle
      </span>
<span class="material-symbols-outlined text-secondary opacity-40 group-active:opacity-100 group-active:translate-x-0.5 transition-all text-[20px] shrink-0">
        chevron_right
      </span>
</button>
<!-- Option 2 -->
<button class="decision-option text-left w-full bg-surface-container-low active:bg-surface-container-high rounded-xl p-4 min-h-[52px] flex items-center justify-between transition-all duration-150 group" onclick="selectDecision(this)" type="button">
<span class="font-body-md text-body-md text-on-surface group-active:text-primary transition-colors leading-snug pr-2">
        Gece boyu hatayı debug et, çözene kadar uğraş
      </span>
<span class="material-symbols-outlined text-secondary opacity-40 group-active:opacity-100 group-active:translate-x-0.5 transition-all text-[20px] shrink-0">
        chevron_right
      </span>
</button>
<!-- Option 3 -->
<button class="decision-option text-left w-full bg-surface-container-low active:bg-surface-container-high rounded-xl p-4 min-h-[52px] flex items-center justify-between transition-all duration-150 group" onclick="selectDecision(this)" type="button">
<span class="font-body-md text-body-md text-on-surface group-active:text-primary transition-colors leading-snug pr-2">
        Kendi branch'inde minimal çalışan bir sürüm kur
      </span>
<span class="material-symbols-outlined text-secondary opacity-40 group-active:opacity-100 group-active:translate-x-0.5 transition-all text-[20px] shrink-0">
        chevron_right
      </span>
</button>
</div>
<!-- Bottom Advisory Micro-copy -->
<footer class="mt-auto pt-2 flex items-center justify-center gap-1.5">
<span class="material-symbols-outlined text-secondary text-[14px]">lock</span>
<p class="font-body-sm text-body-sm text-secondary text-center">
      Seçtikten sonra geri dönemezsin.
    </p>
</footer>
</div>
<script>
  function selectDecision(buttonElement) {
    const allButtons = document.querySelectorAll('.decision-option');
    allButtons.forEach(btn => {
      btn.disabled = true;
      btn.classList.add('opacity-40', 'pointer-events-none');
    });
    buttonElement.classList.remove('opacity-40');
    buttonElement.classList.add('scale-[0.98]', 'bg-surface-container-high');
  }
</script></main></body></html>
