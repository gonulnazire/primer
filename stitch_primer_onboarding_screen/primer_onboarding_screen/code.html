<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface text-on-surface flex flex-col min-h-screen pt-safe pb-safe selection:bg-primary-container selection:text-on-primary-container"><main class="flex flex-col flex-1 relative w-full bg-surface px-margin"><div class="flex flex-col w-full pb-6 select-none">
<!-- Brand Header -->
<header class="flex flex-col pt-2 pb-5">
<div class="flex items-center gap-2">
<span class="font-headline-lg text-headline-lg font-semibold tracking-tight text-on-surface">Primer</span>
<span class="w-2 h-2 rounded-full bg-primary-container inline-block animate-pulse"></span>
</div>
<p class="font-body-md text-body-md text-secondary mt-1.5 font-normal">
      Üç soru, sonra başlıyoruz.
    </p>
</header>
<!-- Stepper / Micro Progress Indicator -->
<div class="flex items-center gap-1.5 mb-6">
<div class="h-1 flex-1 rounded-full bg-surface-container-highest transition-colors duration-300" id="step-dot-1"></div>
<div class="h-1 flex-1 rounded-full bg-surface-container-highest transition-colors duration-300" id="step-dot-2"></div>
<div class="h-1 flex-1 rounded-full bg-surface-container-highest transition-colors duration-300" id="step-dot-3"></div>
</div>
<!-- Form Body -->
<div class="flex flex-col gap-5">
<!-- Question 1: Sınıf -->
<section class="flex flex-col gap-2.5">
<span class="font-label-caps text-label-caps text-secondary uppercase tracking-wider font-semibold">
        KAÇINCI SINIFTASIN?
      </span>
<div aria-label="Kaçıncı sınıftasın?" class="grid grid-cols-2 gap-3" role="radiogroup">
<button class="q-opt min-h-[48px] h-12 px-4 rounded-xl bg-surface-container text-on-surface font-label-lg text-label-lg flex items-center justify-center transition-all duration-150 active:scale-[0.98]" data-group="q1" data-value="1-2" type="button">
          1-2
        </button>
<button class="q-opt min-h-[48px] h-12 px-4 rounded-xl bg-surface-container text-on-surface font-label-lg text-label-lg flex items-center justify-center transition-all duration-150 active:scale-[0.98]" data-group="q1" data-value="3-4" type="button">
          3-4
        </button>
</div>
</section>
<!-- Question 2: Rol -->
<section class="flex flex-col gap-2.5">
<span class="font-label-caps text-label-caps text-secondary uppercase tracking-wider font-semibold">
        HANGİ ROLE YAKINSIN?
      </span>
<div aria-label="Hangi role yakınsın?" class="grid grid-cols-3 gap-2" role="radiogroup">
<button class="q-opt min-h-[48px] h-12 px-2 rounded-xl bg-surface-container text-on-surface font-label-md text-label-md flex items-center justify-center text-center transition-all duration-150 active:scale-[0.98]" data-group="q2" data-value="frontend" type="button">
          Frontend
        </button>
<button class="q-opt min-h-[48px] h-12 px-2 rounded-xl bg-surface-container text-on-surface font-label-md text-label-md flex items-center justify-center text-center transition-all duration-150 active:scale-[0.98]" data-group="q2" data-value="backend" type="button">
          Backend
        </button>
<button class="q-opt min-h-[48px] h-12 px-1 rounded-xl bg-surface-container text-on-surface font-label-md text-label-md flex items-center justify-center text-center leading-tight transition-all duration-150 active:scale-[0.98]" data-group="q2" data-value="bilmiyorum" type="button">
          Henüz bilmiyorum
        </button>
</div>
</section>
<!-- Question 3: Hedef / Odak -->
<section class="flex flex-col gap-2.5">
<span class="font-label-caps text-label-caps text-secondary uppercase tracking-wider font-semibold">
        ŞU AN SENİN İÇİN ÖNEMLİ OLAN?
      </span>
<div aria-label="Şu an senin için önemli olan?" class="flex flex-col gap-2" role="radiogroup">
<button class="q-opt min-h-[48px] h-12 px-4 rounded-xl bg-surface-container text-on-surface font-label-lg text-label-lg flex items-center justify-between text-left transition-all duration-150 active:scale-[0.98]" data-group="q3" data-value="staj" type="button">
<span>Staj bulmak</span>
<span class="indicator-icon material-symbols-outlined text-[18px] opacity-0 text-primary-container transition-opacity">check_circle</span>
</button>
<button class="q-opt min-h-[48px] h-12 px-4 rounded-xl bg-surface-container text-on-surface font-label-lg text-label-lg flex items-center justify-between text-left transition-all duration-150 active:scale-[0.98]" data-group="q3" data-value="proje" type="button">
<span>Projeyi bitirmek</span>
<span class="indicator-icon material-symbols-outlined text-[18px] opacity-0 text-primary-container transition-opacity">check_circle</span>
</button>
<button class="q-opt min-h-[48px] h-12 px-4 rounded-xl bg-surface-container text-on-surface font-label-lg text-label-lg flex items-center justify-between text-left transition-all duration-150 active:scale-[0.98]" data-group="q3" data-value="ogrenmek" type="button">
<span>Öğrenmek</span>
<span class="indicator-icon material-symbols-outlined text-[18px] opacity-0 text-primary-container transition-opacity">check_circle</span>
</button>
</div>
</section>
</div>
<!-- Bottom CTA & Privacy Disclaimer -->
<div class="mt-8 flex flex-col items-center">
<button class="w-full min-h-[48px] h-12 rounded-xl font-label-lg text-label-lg font-semibold flex items-center justify-center transition-all duration-200 cursor-not-allowed bg-surface-container-highest text-secondary shadow-sm" disabled="" id="cta-button" type="button">
      Devam
    </button>
<p class="font-body-sm text-body-sm text-secondary mt-3 text-center tracking-normal font-normal">
      Cevapların kaydedilmiyor.
    </p>
</div>
</div>
<script>
  (function () {
    const answers = {
      q1: null,
      q2: null,
      q3: null
    };

    const ctaBtn = document.getElementById('cta-button');
    const buttons = document.querySelectorAll('.q-opt');

    buttons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.getAttribute('data-group');
        const val = btn.getAttribute('data-value');

        // Toggle / select inside group
        const groupButtons = document.querySelectorAll(`.q-opt[data-group="${group}"]`);
        groupButtons.forEach((b) => {
          b.classList.remove('bg-surface-container-highest', 'text-primary-container', 'shadow-inner');
          b.classList.add('bg-surface-container', 'text-on-surface');
          
          const icon = b.querySelector('.indicator-icon');
          if (icon) {
            icon.classList.remove('opacity-100');
            icon.classList.add('opacity-0');
          }
        });

        // Set active styling on clicked option
        btn.classList.remove('bg-surface-container', 'text-on-surface');
        btn.classList.add('bg-surface-container-highest', 'text-primary-container');
        
        const activeIcon = btn.querySelector('.indicator-icon');
        if (activeIcon) {
          activeIcon.classList.remove('opacity-0');
          activeIcon.classList.add('opacity-100');
        }

        answers[group] = val;

        // Progress indicators
        if (answers.q1) {
          document.getElementById('step-dot-1').classList.replace('bg-surface-container-highest', 'bg-primary-container');
        }
        if (answers.q2) {
          document.getElementById('step-dot-2').classList.replace('bg-surface-container-highest', 'bg-primary-container');
        }
        if (answers.q3) {
          document.getElementById('step-dot-3').classList.replace('bg-surface-container-highest', 'bg-primary-container');
        }

        // Validate complete state
        if (answers.q1 && answers.q2 && answers.q3) {
          ctaBtn.disabled = false;
          ctaBtn.classList.remove('cursor-not-allowed', 'bg-surface-container-highest', 'text-secondary');
          ctaBtn.classList.add('bg-primary-container', 'text-on-primary-container', 'cursor-pointer', 'active:scale-[0.98]');
        }
      });
    });
  })();
</script></main></body></html>
