<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  </head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col pt-safe pb-safe selection:bg-primary-container selection:text-on-primary-container"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin pb-space-2xl">
<!-- Top row / Navigation Bar -->
<div class="w-full flex items-center justify-between pt-space-md pb-space-xl">
<button class="text-left font-body-md text-body-md text-[#9AA6B8] hover:text-[#E6EAF0] transition-colors focus:outline-none focus:text-[#E8A33D] py-space-xs" type="button">
      ← Menü
    </button>
<div aria-label="Adım 2 / 3" class="flex items-center gap-[6px]">
<span class="w-[8px] h-[8px] rounded-full bg-primary-container inline-block"></span>
<span class="w-[8px] h-[8px] rounded-full bg-primary-container inline-block"></span>
<span class="w-[8px] h-[8px] rounded-full border-[1.5px] border-[#222A35] bg-transparent inline-block"></span>
</div>
</div>
<!-- Crisis Panel -->
<section class="relative w-full rounded-2xl bg-[#161B22] border border-[#222A35] py-[18px] px-4 overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-[3px] bg-primary-container"></div>
<p class="font-body-lg text-[15px] leading-[1.5] font-normal text-[#E6EAF0] m-0 pl-1">
      Teslime 48 saat kaldı. Build pipeline kırıldı, npm run build hata veriyor, kimse projeyi derleyemiyor. Hoca canlı demo bekliyor.
    </p>
</section>
<!-- Decision Heading -->
<h1 class="font-headline-lg text-headline-lg font-semibold text-[#E6EAF0] mt-[28px] mb-4">
    Ne yapıyorsun?
  </h1>
<!-- Interactive Option Cards -->
<fieldset class="w-full m-0 p-0 border-0 flex flex-col gap-3">
<legend class="sr-only">Karar seçenekleri</legend>
<button class="decision-btn w-full min-h-[52px] p-4 rounded-xl bg-[#161B22] border border-[#222A35] text-left transition-all duration-150 active:scale-[0.99] focus:outline-none focus:border-primary-container" data-option="1" onclick="handleSelect(this)" type="button">
<span class="font-body-lg text-[15px] leading-snug font-normal text-[#E6EAF0] block pointer-events-none">
        Son çalışan commit'e dön, kaybolan işi sonra ekle
      </span>
</button>
<button class="decision-btn w-full min-h-[52px] p-4 rounded-xl bg-[#161B22] border border-[#222A35] text-left transition-all duration-150 active:scale-[0.99] focus:outline-none focus:border-primary-container" data-option="2" onclick="handleSelect(this)" type="button">
<span class="font-body-lg text-[15px] leading-snug font-normal text-[#E6EAF0] block pointer-events-none">
        Gece boyu hatayı debug et, çözene kadar uğraş
      </span>
</button>
<button class="decision-btn w-full min-h-[52px] p-4 rounded-xl bg-[#161B22] border border-[#222A35] text-left transition-all duration-150 active:scale-[0.99] focus:outline-none focus:border-primary-container" data-option="3" onclick="handleSelect(this)" type="button">
<span class="font-body-lg text-[15px] leading-snug font-normal text-[#E6EAF0] block pointer-events-none">
        Kendi branch'inde minimal çalışan bir sürüm kur
      </span>
</button>
</fieldset>
<!-- Bottom Note -->
<div class="mt-space-xl pt-2">
<p class="font-body-sm text-body-sm text-[#9AA6B8] opacity-80 select-none">
      Seçtikten sonra geri dönemezsin.
    </p>
</div>
</div>
<script>
  function handleSelect(element) {
    const buttons = document.querySelectorAll('.decision-btn');
    buttons.forEach((btn) => {
      btn.classList.remove('border-primary-container', 'bg-[#1C232C]');
      btn.classList.add('border-[#222A35]', 'bg-[#161B22]');
    });
    element.classList.remove('border-[#222A35]', 'bg-[#161B22]');
    element.classList.add('border-primary-container', 'bg-[#1C232C]');
  }
</script></main></body></html>
